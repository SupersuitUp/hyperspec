name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # One dependency (@supersuit/superskill), so it needs an install.
      - run: npm ci
      # `npm test` runs test/*.test.mjs; a bare `node --test` on Node 20 would also execute
      # the .mjs files under test/fixtures/ as tests.
      - run: npm test
      # The package must run the way the README says, from outside the repo.
      - run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/bin/hyperspec.mjs" lint "$GITHUB_WORKSPACE/test/fixtures/valid/spec.md"
